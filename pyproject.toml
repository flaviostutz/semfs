[project]
name = "semfs"
version = "0.0.1"
description = "Semantic file search for local folders with a Python library and CLI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[[project.authors]]
name = "flaviostutz"

[project.scripts]
semfs = "semfs.cli:run"

[dependency-groups]
dev = [
  "pip-audit>=2.9.0",
  "pyright>=1.1.400",
  "pytest>=8.4.0",
  "pytest-cov>=6.1.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semfs"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests", "tests_integration", "examples"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
executionEnvironments = [{ root = ".", extraPaths = ["src"] }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: longer-running integration tests",
]
