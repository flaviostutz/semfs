[project]
name = "semfs"
version = "0.0.1"
description = "Semantic file queries for local folders via a Python library and CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2.0",
  "pydantic>=2.11.0",
  "sentence-transformers>=5.0.0",
  "sqlite-vec>=0.1.6",
  "typer>=0.16.0",
]

[[project.authors]]
name = "flaviostutz"

[project.scripts]
semfs = "semfs.cli:main"

[dependency-groups]
dev = [
  "pip-audit>=2.9.0",
  "pyright>=1.1.400",
  "pytest>=8.4.0",
  "pytest-cov>=6.1.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["src", "tests", "examples"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
